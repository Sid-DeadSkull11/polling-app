{% extends "base.html" %}

{% block content %}

<div class="container">

     <div class="card">

          <h2>{{ poll.question }}</h2>

          <h4>Choose your option and cast your vote</h4>

          <form method="POST" action="{{ url_for('vote', poll_id=poll.id) }}">

               <label for="voter_id">Voter ID</label>

               <input type="text" id="voter_id" name="voter_id" placeholder="Enter your voter ID" required>

               <h4>Poll Options</h4>

               {% for option in options %}

               <div>
                    <label>
                         <input type="radio" name="option_id" value="{{ option.id }}" required>
                         {{ option.option_text }}
                    </label>
               </div>

               {% endfor %}

               <button type="submit">Submit Vote</button>

          </form>

          <a href="{{ url_for('index') }}">Back to Home</a>

     </div>

</div>

{% endblock %}
